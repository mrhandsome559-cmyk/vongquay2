<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn (Đồng Bộ Firebase)</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            color: #333;
        }

        input {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 10px;
        }

        #wheel-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 30px auto;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #333;
            position: relative;
            overflow: hidden;
            transition: transform 4s ease-out;
            box-sizing: border-box;
        }

        .pointer {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid red;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .segment {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 24px;
        }

        .result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            min-height: 30px;
        }

        .history {
            margin-top: 30px;
            text-align: left;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .history table {
            width: 100%;
            border-collapse: collapse;
        }

        .history th,
        .history td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        
        .history th {
            background-color: #f2f2f2;
        }

        .admin-panel {
            margin-top: 20px;
            padding: 10px;
            background: #e9e9e9;
            border-radius: 50px;
            display: inline-block;
        }
        .btn-reset {
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 Vòng Quay May Mắn (Realtime)</h1>

    <input type="text" id="playerName" placeholder="Nhập tên người chơi">
    <button id="spinBtn">Quay</button>

    <div id="wheel-wrapper">
        <div class="pointer"></div>
        <div id="wheel"></div>
    </div>

    <div class="result" id="result"></div>

    <div class="admin-panel">
        <button id="resetBtn" class="btn-reset">Cài đặt lại vòng quay (Reset từ đầu)</button>
    </div>

    <div class="history">
        <h3>Lịch sử quay (Tất cả thiết bị)</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Người chơi</th>
                    <th>Kết quả</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>
</div>
